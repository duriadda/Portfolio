<!--
  같은 페이지 앵커(#about 등) 이동을 스크립트로 처리한다.
  Safari가 앵커 링크를 눌렀을 때 스크롤 대신 내용 미리보기 상자를 띄우는 문제를 피하기 위함.
  스크립트가 없어도 기존 href="#..." 링크로 동작하고, 뒤로 가기·직접 URL 접근도 유지된다.
-->
<script>
  (() => {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // hash에 해당하는 요소로 스크롤하고 초점을 옮긴다(키보드·화면 낭독기 사용자의 위치도 함께 이동)
    const scrollToHash = (hash, smooth, moveFocus = true) => {
      const id = decodeURIComponent((hash || "").slice(1));
      const target = id ? document.getElementById(id) : null;
      if (!target) return false;
      target.scrollIntoView({ behavior: smooth && !reduceMotion.matches ? "smooth" : "auto", block: "start" });
      if (moveFocus) {
        if (!target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
      }
      return true;
    };

    document.addEventListener("click", (event) => {
      const link = event.target.closest('a[href^="#"]');
      // 새 탭 열기 등 보조 키 클릭은 브라우저 기본 동작에 맡긴다
      if (!link || event.defaultPrevented || event.button !== 0 ||
          event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const hash = link.getAttribute("href");
      if (!document.getElementById(decodeURIComponent(hash.slice(1)))) return;
      event.preventDefault();
      if (location.hash !== hash) history.pushState(null, "", hash);
      scrollToHash(hash, true);
    });

    // 뒤로·앞으로 가기: 브라우저가 저장해 둔 옛 스크롤 위치로 덮어쓰지 않도록 복원을 직접 맡고,
    // 해당 기록의 #섹션으로 이동한다
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.addEventListener("popstate", () => {
      if (!scrollToHash(location.hash, false)) window.scrollTo(0, 0);
    });

    // 복원을 직접 맡았으므로 새로고침·직접 접근 시에도 #섹션 위치로 이동한다
    // (웹폰트·이미지 로딩으로 높이가 바뀐 뒤 위치를 맞추도록 load 이후 실행, 초점은 옮기지 않음)
    window.addEventListener("load", () => {
      if (location.hash) scrollToHash(location.hash, false, false);
    });
  })();
</script>
