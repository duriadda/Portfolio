<head>
  <title>{{ .Site.Params.title }}</title>

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="description" content="{{ .Site.Params.description }}" />
  <meta name="author" content="{{ .Site.Params.author }}" />
  <!-- 지정하지 않으면 브라우저가 도메인 루트의 /favicon.ico를 요청해 404가 난다 -->
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />

  {{ $css := resources.Get "main.css" | css.TailwindCSS }}
  {{ if hugo.IsProduction }}
  {{ with $css | minify | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ .RelPermalink }}"
    integrity="{{ .Data.Integrity }}"
    crossorigin="anonymous"
  />
  {{ end }}
  {{ else}}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
  {{ end }}

  <script>
    // 현재 테마를 html의 dark 클래스로 판단해 전환하고,
    // 아이콘(실제 존재하는 bootstrap-icons 클래스)과 버튼 이름을 함께 갱신한다
    const toggleTheme = (btn) => {
      const dark = document.documentElement.classList.toggle("dark");
      const icon = btn.querySelector("i");
      icon.classList.toggle("bi-lightbulb-fill", dark);
      icon.classList.toggle("bi-lightbulb-off-fill", !dark);
      const label = dark ? "라이트 모드로 전환" : "다크 모드로 전환";
      btn.setAttribute("aria-label", label);
      btn.title = label;
    };
  </script>
</head>
