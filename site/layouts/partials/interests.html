{{- with hugo.Data.interests }}
<section id="interests" class="mb-8">
  <h2 class="mt-8 sm:mt-0">
    <i class="bi bi-broadcast" aria-hidden="true"></i>
    {{ .title }}
  </h2>
  {{ range .list }}
  <h3 class="mb-1">{{ .field }}</h3>
  <p class="mb-2">{{ .summary | markdownify }}</p>
  <p class="mb-0"><strong>관심을 갖게 된 이유</strong> · {{ .reason | markdownify }}</p>
  {{ end }}
</section>
{{- end }}
