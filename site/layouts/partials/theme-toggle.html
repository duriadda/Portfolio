<script>
  // 버튼 아이콘(실제 존재하는 bootstrap-icons 클래스)과 이름을 현재 테마에 맞춘다
  const syncThemeButton = (btn) => {
    const dark = document.documentElement.classList.contains("dark");
    const icon = btn.querySelector("i");
    icon.classList.toggle("bi-lightbulb-fill", dark);
    icon.classList.toggle("bi-lightbulb-off-fill", !dark);
    const label = dark ? "라이트 모드로 전환" : "다크 모드로 전환";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  };

  // 전환하고 선택을 저장해 새로고침·재방문 때도 유지한다
  const toggleTheme = (btn) => {
    const dark = document.documentElement.classList.toggle("dark");
    try {
      localStorage.setItem("theme", dark ? "dark" : "light");
    } catch (e) {
      // 저장소가 막혀 있으면 이번 방문에서만 유지
    }
    syncThemeButton(btn);
  };

  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector('header button[onclick^="toggleTheme"]');
    if (!btn) return;
    // 서버가 그린 기본 아이콘을 theme-init이 정한 실제 테마에 맞춘다
    syncThemeButton(btn);
    // 직접 고른 값이 없으면 운영체제 설정이 바뀔 때 따라간다
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
      let saved = null;
      try {
        saved = localStorage.getItem("theme");
      } catch (e) {}
      if (saved) return;
      document.documentElement.classList.toggle("dark", event.matches);
      syncThemeButton(btn);
    });
  });
</script>
