<script>
  // 첫 화면을 그리기 전에 테마를 정한다(깜빡임 방지를 위해 head에서 CSS보다 먼저 실행)
  // 우선순위: 방문자가 버튼으로 고른 값(localStorage) > 운영체제 다크/라이트 설정
  (() => {
    let saved = null;
    try {
      saved = localStorage.getItem("theme");
    } catch (e) {
      // 개인정보 보호 모드 등에서 저장소 접근이 막혀도 페이지는 동작해야 한다
    }
    const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
