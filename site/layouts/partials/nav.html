<!-- 상단 앵커 메뉴: 화면에 고정하지 않아 앵커 도착 지점을 가리지 않는다 -->
<nav id="top" aria-label="주요 메뉴" class="bg-panel dark:bg-panel-dark px-3 py-2">
  <ul class="flex flex-wrap gap-x-1 gap-y-1 list-none ml-0 mb-0">
    {{ range .Site.Menus.main }}
    <li>
      <a
        class="block px-3 py-2 rounded no-underline hover:underline hover:bg-page dark:hover:bg-page-dark"
        href="{{ .URL }}"
        >{{ .Name }}</a
      >
    </li>
    {{ end }}
  </ul>
</nav>
