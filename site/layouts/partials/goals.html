{{- with hugo.Data.goals }}
<section id="goals" class="mb-8">
  <h2>
    <i class="bi bi-flag" aria-hidden="true"></i>
    {{ .title }}
  </h2>
  {{ range .list }}
  <h3 class="mb-1">{{ .goal }}</h3>
  <p class="mb-2">{{ .description | markdownify }}</p>
  {{ with .next_steps }}
  <p class="mb-1"><strong>다음 행동</strong></p>
  <ul>
    {{ range . }}<li>{{ . | markdownify }}</li>{{ end }}
  </ul>
  {{ end }}
  {{ end }}
</section>
{{- end }}
