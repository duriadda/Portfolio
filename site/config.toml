baseURL = "https://duriadda.github.io/Portfolio/"
locale = "ko-KR"
defaultContentLanguage = "ko"
disableKinds = ["taxonomy"]

[build]
    writeStats = true

# 상단 앵커 메뉴 (각 url은 index.html의 섹션 id와 일치해야 함)
[[menu.main]]
    name = "소개"
    url = "#about"
    weight = 10
[[menu.main]]
    name = "관심 분야"
    url = "#interests"
    weight = 20
[[menu.main]]
    name = "학습 목표"
    url = "#goals"
    weight = 30
[[menu.main]]
    name = "활동"
    url = "#activities"
    weight = 40
[[menu.main]]
    name = "역량"
    url = "#skills"
    weight = 50

[params]
    title = "장현욱 | 포트폴리오"
    author = "장현욱"
    description = "통신 네트워크를 공부하는 장현욱의 포트폴리오"
    copyright = "© 2026 장현욱"
    theme = "dark" # `dark` or `light`

    # 프로필 영역 (본인 사진 대신 캐릭터 아바타 사용)
    [params.profile]
        name = "장현욱"
        title = "통신 네트워크 · 무선통신 연구"
        photo = "images/avatar.webp"
        photo_alt = "장현욱의 프로필 아바타 (빼꼼 내다보는 캐릭터 그림)"

    [params.aboutme]
        heading = "소개"
        description = "통신 네트워크에 관심을 두고 Next Lab에서 무선통신 기술을 연구하고 있습니다. 현재는 엣지 환경에서의 KV 캐싱(KV Edge Caching)을 목표로 공부하고 있습니다."

    # 소셜 링크 (실제 주소만 남김)
    [params.social]
        title = "Links"

        [[params.social.list]]
        icon = "bi bi-github"
        url = "https://github.com/duriadda"
        title = "GitHub"
